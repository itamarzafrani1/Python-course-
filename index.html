<!DOCTYPE html>
<html lang="he" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מסלול פייתון — מהיסודות לבקאנד ולבדיקות</title>
<meta name="description" content="קורס פייתון מקצה לקצה: יסודות, OOP, pytest, FastAPI ובקאנד — עובד אופליין.">
<meta name="theme-color" content="#151322">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="פייתון">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
/* ============================================================
   Design tokens
   palette derived from pytest's own session colors:
   pass / fail / xfail / pending, on an ink-plum base
   ============================================================ */
:root{
  --pass:#4FD08A;
  --fail:#F2545B;
  --xfail:#E8B24A;
  --accent:#8B7FF5;
  --accent-2:#5CC8E8;

  --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Mono", Menlo, Consolas, "Courier New", monospace;
  --sans: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, "Noto Sans Hebrew", sans-serif;

  --r-sm:6px; --r-md:10px; --r-lg:16px;
  --sidebar-w: 310px;
  --maxw: 780px;
}
html[data-theme="dark"]{
  --bg:#151322;
  --bg-2:#1C1A2B;
  --surface:#221F33;
  --surface-2:#2A2740;
  --code-bg:#12101C;
  --line:#332F4A;
  --line-soft:#282540;
  --ink:#E9E6F5;
  --ink-2:#B4AECD;
  --ink-3:#7E789A;
  --shadow: 0 18px 44px -20px rgba(0,0,0,.75);
  --tok-str:#9AE6B4; --tok-kw:#C4A8FF; --tok-com:#6B6688; --tok-num:#F0B67F;
  --tok-fn:#6FD0F0; --tok-dec:#E8B24A; --tok-builtin:#7FB8FF;
}
html[data-theme="light"]{
  --bg:#F4F3F9;
  --bg-2:#EDEBF5;
  --surface:#FFFFFF;
  --surface-2:#F2F0FA;
  --code-bg:#1B1930;
  --line:#DDD9EC;
  --line-soft:#E8E5F3;
  --ink:#1D1A2E;
  --ink-2:#514C6B;
  --ink-3:#847EA0;
  --shadow: 0 14px 34px -18px rgba(40,30,80,.35);
  --tok-str:#9AE6B4; --tok-kw:#C4A8FF; --tok-com:#6B6688; --tok-num:#F0B67F;
  --tok-fn:#6FD0F0; --tok-dec:#E8B24A; --tok-builtin:#7FB8FF;
  --pass:#1E9E63; --fail:#D93943; --xfail:#B47A0B; --accent:#6455E0;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.75;
  -webkit-text-size-adjust:100%;
  overflow-wrap:anywhere;
}
button{font-family:inherit;cursor:pointer}
a{color:var(--accent)}
::selection{background:var(--accent);color:#fff}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px;border-radius:4px}

/* ============================================================ layout */
.app{display:flex;min-height:100vh;align-items:stretch}
.sidebar{
  width:var(--sidebar-w);flex:0 0 var(--sidebar-w);
  background:var(--bg-2);
  border-inline-start:1px solid var(--line);
  height:100vh;position:sticky;top:0;
  display:flex;flex-direction:column;
}
.main{flex:1;min-width:0;display:flex;flex-direction:column}

/* ============================================================ brand */
.brand{padding:18px 20px 14px;padding-top:calc(18px + env(safe-area-inset-top));border-bottom:1px solid var(--line)}
.brand-mark{
  font-family:var(--mono);font-size:12px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3);margin-bottom:6px;
}
.brand-name{font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.25}
.brand-name em{font-style:normal;color:var(--accent)}

/* ============================================================ search */
.search-wrap{padding:12px 14px;border-bottom:1px solid var(--line)}
.search{
  width:100%;background:var(--surface);border:1px solid var(--line);
  color:var(--ink);border-radius:var(--r-md);padding:9px 12px;font-size:14px;
  font-family:var(--sans);
}
.search::placeholder{color:var(--ink-3)}

/* ============================================================ tree */
.tree{flex:1;overflow-y:auto;padding:10px 8px calc(40px + env(safe-area-inset-bottom));scrollbar-width:thin}
.mod{margin-bottom:2px}
summary{cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary::marker{content:""}
.mod-btn{
  width:100%;display:flex;align-items:center;gap:10px;
  background:none;border:0;color:var(--ink);text-align:start;
  padding:9px 10px;border-radius:var(--r-sm);font-size:14.5px;font-weight:650;
  line-height:1.35;
}
.mod-btn:hover{background:var(--surface)}
.mod-idx{font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.06em;flex:0 0 auto}
.mod-chev{margin-inline-start:auto;color:var(--ink-3);font-size:11px;transition:transform .18s ease}
.mod[open] .mod-chev{transform:rotate(90deg)}
.mod-list{list-style:none;margin:2px 0 8px;padding:0 18px 0 6px}
.lesson-btn{
  width:100%;display:flex;align-items:flex-start;gap:9px;
  background:none;border:0;color:var(--ink-2);text-align:start;
  padding:7px 9px;border-radius:var(--r-sm);font-size:13.5px;line-height:1.45;
}
.lesson-btn:hover{background:var(--surface);color:var(--ink)}
.lesson-btn[aria-current="true"]{background:var(--surface-2);color:var(--ink);box-shadow:inset 2px 0 0 var(--accent)}
html[dir="rtl"] .lesson-btn[aria-current="true"]{box-shadow:inset -2px 0 0 var(--accent)}
.glyph{font-family:var(--mono);font-size:13px;flex:0 0 12px;text-align:center;line-height:1.55}
.g-pending{color:var(--ink-3)}
.g-pass{color:var(--pass)}
.g-xfail{color:var(--xfail)}

/* ============================================================ topbar + signature session line */
.topbar{
  position:sticky;top:0;z-index:20;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  padding:10px 22px;
  padding-top:calc(10px + env(safe-area-inset-top));
  padding-inline-start:calc(22px + env(safe-area-inset-left));
  padding-inline-end:calc(22px + env(safe-area-inset-right));
  display:flex;align-items:center;gap:14px;
}
.icon-btn{
  background:var(--surface);border:1px solid var(--line);color:var(--ink-2);
  width:36px;height:36px;border-radius:var(--r-sm);display:grid;place-items:center;
  font-family:var(--mono);font-size:14px;flex:0 0 auto;
}
.icon-btn:hover{color:var(--ink);border-color:var(--accent)}
.menu-btn{display:none}

.session{flex:1;min-width:0;direction:ltr;text-align:left}
.session-head{
  font-family:var(--mono);font-size:11px;color:var(--ink-3);
  letter-spacing:.04em;margin-bottom:1px;
}
.dots{
  font-family:var(--mono);font-size:13px;line-height:1.1;
  letter-spacing:.09em;white-space:nowrap;overflow-x:auto;
  scrollbar-width:none;display:block;padding-bottom:2px;
}
.dots::-webkit-scrollbar{display:none}
.dots span{cursor:pointer}
.dots .d-pending{color:var(--ink-3)}
.dots .d-pass{color:var(--pass)}
.dots .d-xfail{color:var(--xfail)}
.dots .d-here{color:var(--accent);font-weight:700}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(2.1)}100%{transform:scale(1)}}
.dots .pop{display:inline-block;animation:pop .45s ease}

/* ============================================================ article */
.scroller{flex:1;overflow:visible}
.article{max-width:var(--maxw);margin:0 auto;padding:38px 22px 20px}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.fade{animation:rise .34s ease}

.eyebrow{
  font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;
  color:var(--accent);text-transform:uppercase;margin-bottom:10px;
  direction:ltr;text-align:start;
}
h1.title{font-size:clamp(26px,4.4vw,36px);line-height:1.2;letter-spacing:-.025em;margin:0 0 10px;font-weight:800}
.lede{color:var(--ink-2);font-size:17px;margin:0 0 30px;padding-bottom:22px;border-bottom:1px solid var(--line-soft)}

h2.sec{
  font-size:20px;font-weight:750;letter-spacing:-.015em;margin:38px 0 12px;
  display:flex;align-items:center;gap:10px;
}
h2.sec::before{
  content:"";width:7px;height:7px;border-radius:2px;background:var(--accent);flex:0 0 auto;
}
p{margin:0 0 15px}
.article ul,.article ol{margin:0 0 16px;padding-inline-start:22px}
.article li{margin-bottom:7px}
code.inline{
  font-family:var(--mono);font-size:.87em;background:var(--surface-2);
  border:1px solid var(--line-soft);padding:1.5px 6px;border-radius:5px;
  direction:ltr;display:inline-block;color:var(--ink);
}
strong{font-weight:700;color:var(--ink)}

/* ============================================================ code blocks */
.codewrap{margin:0 0 20px;border-radius:var(--r-md);overflow:hidden;border:1px solid var(--line);background:var(--code-bg)}
.codebar{
  display:flex;align-items:center;gap:8px;padding:7px 12px;
  background:rgba(255,255,255,.035);border-bottom:1px solid rgba(255,255,255,.07);
}
.codebar .file{font-family:var(--mono);font-size:11.5px;color:#8E88AE;direction:ltr}
.copy{
  margin-inline-start:auto;background:none;border:1px solid rgba(255,255,255,.14);
  color:#A9A3C6;font-family:var(--mono);font-size:11px;padding:3px 9px;border-radius:5px;
}
.copy:hover{color:#fff;border-color:var(--accent)}
pre{
  margin:0;padding:14px 16px;overflow-x:auto;direction:ltr;text-align:left;
  font-family:var(--mono);font-size:13.2px;line-height:1.65;color:#DCD8F0;
  tab-size:4;
}
.t-str{color:var(--tok-str)} .t-kw{color:var(--tok-kw)} .t-com{color:var(--tok-com);font-style:italic}
.t-num{color:var(--tok-num)} .t-fn{color:var(--tok-fn)} .t-dec{color:var(--tok-dec)} .t-bi{color:var(--tok-builtin)}
.o-pass{color:var(--pass)} .o-fail{color:var(--fail);font-weight:600} .o-warn{color:var(--xfail)}
.o-dim{color:#6B6688} .o-cmd{color:#DCD8F0;font-weight:600}

/* ============================================================ callouts */
.note{
  border:1px solid var(--line);background:var(--surface);
  border-radius:var(--r-md);padding:14px 16px;margin:0 0 20px;
  border-inline-start:3px solid var(--accent-2);
}
.note.warn{border-inline-start-color:var(--fail)}
.note.tip{border-inline-start-color:var(--pass)}
.note-t{
  font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:5px;
}
.note p:last-child,.note ul:last-child{margin-bottom:0}

/* ============================================================ table */
.tablewrap{overflow-x:auto;margin:0 0 20px;border:1px solid var(--line);border-radius:var(--r-md)}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:420px}
th,td{padding:9px 13px;text-align:start;border-bottom:1px solid var(--line-soft)}
th{background:var(--surface);font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);font-weight:650}
tr:last-child td{border-bottom:0}
td code.inline{white-space:nowrap}

/* ============================================================ exercise */
.ex{border:1px dashed var(--line);border-radius:var(--r-md);padding:16px;margin:0 0 20px;background:var(--surface)}
.ex-t{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--xfail);margin-bottom:7px}
.reveal{
  background:none;border:1px solid var(--line);color:var(--ink-2);
  padding:6px 13px;border-radius:var(--r-sm);font-size:13px;font-weight:600;
}
.reveal:hover{border-color:var(--accent);color:var(--ink)}
.hidden{display:none}

/* ============================================================ quiz */
.quiz{border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);padding:18px;margin:0 0 20px}
.quiz-t{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.quiz-q{font-weight:650;margin-bottom:12px}
.opt{
  display:block;width:100%;text-align:start;background:var(--bg-2);
  border:1px solid var(--line);color:var(--ink);border-radius:var(--r-sm);
  padding:10px 13px;margin-bottom:8px;font-size:14.5px;line-height:1.5;
  transition:border-color .15s,background .15s;
}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default;opacity:.75}
.opt.right{border-color:var(--pass);background:color-mix(in srgb,var(--pass) 12%,var(--surface));opacity:1}
.opt.wrong{border-color:var(--fail);background:color-mix(in srgb,var(--fail) 12%,var(--surface));opacity:1}
.quiz-fb{font-size:14px;color:var(--ink-2);margin-top:10px;padding-top:10px;border-top:1px solid var(--line-soft)}
.quiz-fb.hidden{display:none}

/* ============================================================ nav */
.lesson-nav{
  max-width:var(--maxw);margin:0 auto;
  padding:26px 22px calc(70px + env(safe-area-inset-bottom));
  display:flex;gap:12px;align-items:stretch;
}
.nav-btn{
  flex:1;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
  padding:13px 15px;text-align:start;color:var(--ink);min-width:0;
}
.nav-btn:hover{border-color:var(--accent)}
.nav-btn:disabled{opacity:.35;cursor:default}
.nav-k{font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.08em;display:block;margin-bottom:3px}
.nav-l{font-size:14px;font-weight:650;line-height:1.4;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.done-btn{
  width:100%;border:1px solid var(--pass);background:color-mix(in srgb,var(--pass) 14%,transparent);
  color:var(--ink);border-radius:var(--r-md);padding:13px;font-weight:700;font-size:15px;margin-top:4px;
}
.done-btn[data-on="1"]{background:var(--pass);color:#0E1A14;border-color:var(--pass)}

/* ============================================================ search results */
.results{list-style:none;margin:0;padding:6px 4px}
.results li{margin-bottom:4px}
.res-btn{width:100%;text-align:start;background:none;border:0;color:var(--ink-2);padding:8px 10px;border-radius:var(--r-sm);font-size:13.5px;line-height:1.4}
.res-btn:hover{background:var(--surface);color:var(--ink)}
.res-mod{display:block;font-family:var(--mono);font-size:10.5px;color:var(--ink-3);letter-spacing:.05em}
.empty{color:var(--ink-3);font-size:13.5px;padding:14px 10px;line-height:1.6}

/* ============================================================ overlay for mobile drawer */
.scrim{display:none;position:fixed;inset:0;background:rgba(8,6,16,.6);z-index:40}
.scrim.on{display:block}

@media (max-width:900px){
  :root{--sidebar-w:290px}
  .sidebar{
    position:fixed;inset-block:0;inset-inline-end:0;z-index:50;
    transform:translateX(100%);transition:transform .25s ease;box-shadow:var(--shadow);
  }
  html[dir="rtl"] .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:none !important}
  .menu-btn{display:grid}
  .topbar{padding:9px 14px;padding-top:calc(9px + env(safe-area-inset-top))}
  .article{padding:26px 16px 12px;
    padding-inline-start:calc(16px + env(safe-area-inset-left));
    padding-inline-end:calc(16px + env(safe-area-inset-right))}
  .lesson-nav{padding:20px 16px 60px;flex-wrap:wrap}
  .nav-btn{flex:1 1 46%}
  pre{font-size:12.4px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important}
}
</style>
</head>
<body>
<div class="scrim" id="scrim"></div>
<div class="app">
  <main class="main">
    <div class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="פתיחת תפריט השיעורים">☰</button>
      <div class="session">
        <div class="session-head" id="sessionHead">test session starts</div>
        <div class="dots" id="dots"></div>
      </div>
      <button class="icon-btn" id="themeBtn" aria-label="החלפת ערכת צבעים">◐</button>
    </div>
    <div class="scroller">
      <article class="article" id="article"></article>
      <nav class="lesson-nav" id="nav"></nav>
    </div>
  </main>

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">python &nbsp;·&nbsp; end-to-end track</div>
      <div class="brand-name">מיסודות פייתון<br>ל<em>בקאנד ולבדיקות</em></div>
    </div>
    <div class="search-wrap">
      <input class="search" id="search" type="search" placeholder="חיפוש שיעור, מושג או דגל…" aria-label="חיפוש">
    </div>
    <div class="tree" id="tree"></div>
  </aside>
</div>
<script>
/* ============================================================
   COURSE CONTENT
   block types:
   p / h / ul / code / out / note / table / ex / q
   ============================================================ */
const COURSE = [
{
  id:"m1", idx:"M01", title:"יסודות פייתון", tag:"python::basics",
  lessons:[
  {
    id:"l101", tag:"setup::environment", title:"סביבת עבודה: פייתון, venv ו-pip",
    lede:"לפני שכותבים שורת קוד אחת — מסדרים סביבה נקייה. זה בדיוק אותו תהליך שתעשה בכל פרויקט אמיתי.",
    blocks:[
      ['h','בדיקה שפייתון מותקן'],
      ['p','פתח טרמינל (Terminal ב-macOS/Linux, PowerShell ב-Windows) והרץ:'],
      ['out','$ python --version\nPython 3.12.4'],
      ['p','אם זה לא עובד, נסה `python3 --version`. בכל הקורס אני אכתוב `python`, אבל אם אצלך זה `python3` — פשוט תחליף.'],
      ['h','למה צריך סביבה וירטואלית'],
      ['p','כל פרויקט צריך את **החבילות שלו בגרסאות שלו**. סביבה וירטואלית (virtual environment) היא תיקייה מבודדת שמכילה עותק של פייתון והחבילות של הפרויקט הזה בלבד. בלעדיה, שני פרויקטים ידרסו זה לזה גרסאות.'],
      ['code','bash','terminal',`# יצירת תיקיית פרויקט
mkdir calc-project && cd calc-project

# יצירת סביבה וירטואלית בשם venv
python -m venv venv

# הפעלה — macOS / Linux
source venv/bin/activate

# הפעלה — Windows PowerShell
venv\\Scripts\\Activate.ps1`],
      ['p','אחרי ההפעלה תראה `(venv)` בתחילת שורת הפקודה. זה הסימן שאתה בפנים.'],
      ['h','התקנת חבילות'],
      ['out','$ pip install pytest\nCollecting pytest\nSuccessfully installed pytest-8.3.2 pluggy-1.5.0 iniconfig-2.0.0\n\n$ pip list\nPackage    Version\n---------- -------\niniconfig  2.0.0\npluggy     1.5.0\npytest     8.3.2'],
      ['note','tip','אפשר לתרגל גם בלי התקנה','בתשעה מהתרגילים בקורס יש עורך קוד שמריץ עליך pytest אמיתי בדפדפן. זה נוח ללמידה — אבל **בכל זאת התקן סביבה מקומית**, כי שם תעבוד בפועל.'],
      ['note','tip','טיפ מהשטח','כדי לצאת מהסביבה: `deactivate`. כדי לשמור את רשימת החבילות: `pip freeze > requirements.txt`, וכדי להתקין אותן במחשב אחר: `pip install -r requirements.txt`.'],
      ['ex','צור תיקייה בשם calc-project, בתוכה סביבה וירטואלית, הפעל אותה, והתקן pytest. ודא בעזרת pip list שהוא מותקן.','mkdir calc-project\ncd calc-project\npython -m venv venv\nsource venv/bin/activate      # Windows: venv\\Scripts\\Activate.ps1\npip install pytest\npip list','bash'],
      ['q','מה התפקיד העיקרי של סביבה וירטואלית?',[
        'להריץ את הקוד מהר יותר',
        'לבודד את החבילות והגרסאות של הפרויקט משאר המערכת',

# ==================================================== mini pytest
class _Approx:
    def __init__(self, expected, rel=None, abs=None):
        self.expected, self.rel, self.abs = expected, rel, abs

    def _close(self, a, b):
        if self.abs is not None and abs(a - b) <= self.abs:
            return True
        tol = self.rel if self.rel is not None else 1e-6
        return abs(a - b) <= tol * max(abs(a), abs(b), 1e-12)

    def __eq__(self, other):
        e = self.expected
        try:
            if isinstance(e, dict):
                return set(e) == set(other) and all(self._close(other[k], e[k]) for k in e)
            if isinstance(e, (list, tuple)):
                return len(e) == len(other) and all(self._close(x, y) for x, y in zip(other, e))
            return self._close(other, e)
        except Exception:
            return False

    def __repr__(self):
        return "approx(%r)" % (self.expected,)


def _approx(expected, rel=None, abs=None):
    return _Approx(expected, rel, abs)


class _Raises:
    def __init__(self, expected, match=None):
        self.expected, self.match = expected, match
        self.value = None
        self.type = None

    def __enter__(self):
        return self

    def __exit__(self, et, ev, tb):
        if et is None:
            raise AssertionError("DID NOT RAISE " + repr(self.expected))
        if not issubclass(et, self.expected):
            return False
        if self.match and not re.search(self.match, str(ev)):
            raise AssertionError("regex %r does not match %r" % (self.match, str(ev)))
        self.value, self.type = ev, et
        return True


class _Mark:
    def __init__(self, name):

    def __call__(self, *a, **k):
        if len(a) == 1 and not k and callable(a[0]) and not isinstance(a[0], (str, list, tuple)):
            return self._apply(a[0], (), {})
        def deco(fn):
            return self._apply(fn, a, k)
        return deco

    def _apply(self, fn, a, k):
        if self.name == "parametrize":
            names = a[0]
            if isinstance(names, str):
                names = [n.strip() for n in names.split(",") if n.strip()]
            cases = list(a[1])
            ids = k.get("ids")
            stack = getattr(fn, "_params", [])
            fn._params = stack + [(names, cases, ids)]
        elif self.name in ("skip", "skipif"):
            cond = a[0] if (self.name == "skipif" and a) else k.get("condition", True)
            if self.name == "skip":
                cond = True
            if cond:
                fn._skip = k.get("reason", "")
        elif self.name == "xfail":
            fn._xfail = k.get("reason", "")
        else:
            fn._marks = getattr(fn, "_marks", []) + [self.name]

class _MonkeyPatch:
    def __init__(self):
        self._undo = []

    def setattr(self, target, name, value=None):
        if isinstance(target, str):
            modname, _, attr = target.rpartition(".")
            target, name, value = sys.modules[modname], attr, name
        old = getattr(target, name, None)
        had = hasattr(target, name)
        self._undo.append(lambda: setattr(target, name, old) if had else delattr(target, name))
        setattr(target, name, value)

    def delattr(self, target, name, raising=True):
        if hasattr(target, name):
            old = getattr(target, name)
            self._undo.append(lambda: setattr(target, name, old))
            delattr(target, name)
        elif raising:
            raise AttributeError(name)

    def setenv(self, key, value):
        old = os.environ.get(key)
        self._undo.append(lambda: os.environ.__setitem__(key, old) if old is not None else os.environ.pop(key, None))
        os.environ[key] = str(value)

    def delenv(self, key, raising=True):
        if key in os.environ:
            old = os.environ[key]
            self._undo.append(lambda: os.environ.__setitem__(key, old))
            del os.environ[key]
        elif raising:
            raise KeyError(key)

    def setitem(self, d, key, value):
        had, old = key in d, d.get(key)
        self._undo.append(lambda: d.__setitem__(key, old) if had else d.pop(key, None))
        d[key] = value

    def chdir(self, path):
        old = os.getcwd()
        self._undo.append(lambda: os.chdir(old))
        os.chdir(str(path))

    def undo(self):
        for fn in reversed(self._undo):
            try:
                fn()
            except Exception:
                pass
        self._undo = []

class _CapSys:
    def __init__(self):
        self._out, self._err = io.StringIO(), io.StringIO()
        self._o, self._e = sys.stdout, sys.stderr
        sys.stdout, sys.stderr = self._out, self._err

    def readouterr(self):
        o, e = self._out.getvalue(), self._err.getvalue()
        self._out.truncate(0); self._out.seek(0)
        self._err.truncate(0); self._err.seek(0)
        return _Captured(o, e)

    def _release(self):
        sys.stdout, sys.stderr = self._o, self._e


def _importorskip(name, *a, **k):
    try:
        return __import__(name)
    except ImportError:
        raise _Skipped("could not import " + name)


def _install_mini():
    m = types.ModuleType("pytest")
    m.raises = _Raises
    m.approx = _approx
    m.fixture = _fixture
    m.mark = _MarkGen()
    m.param = _param
    m.skip = _skip
    m.fail = _fail
    m.importorskip = _importorskip
    m.warns = _Raises
    m.MonkeyPatch = _MonkeyPatch
    m.__version__ = "mini"
    sys.modules["pytest"] = m
    return m


if ENGINE == "mini":
    _install_mini()


# ==================================================== mini runner
def _collect(mod):
    items = []
    for name, obj in list(vars(mod).items()):
        if name.startswith("test_") and callable(obj) and not isinstance(obj, type):
            items.append((name, obj, None))
        elif name.startswith("Test") and isinstance(obj, type):
            for mn in dir(obj):
                if mn.startswith("test_"):
                    items.append((name + "::" + mn, getattr(obj, mn), obj))
    return items


def _cases(fn):
    stacks = list(reversed(getattr(fn, "_params", [])))
    if not stacks:
        return [({}, "")]
    grids = []
    for names, values, ids in stacks:
        row = []
        for i, v in enumerate(values):
            if isinstance(v, _Param):
                v = v.values[0] if len(v.values) == 1 else v.values
            vals = v if isinstance(v, (list, tuple)) and len(names) > 1 else (v,)
            label = ids[i] if ids and i < len(ids) else "-".join(str(x) for x in vals)
            row.append((dict(zip(names, vals)), label))
        grids.append(row)
    out = []
    for combo in itertools.product(*grids):
        kw = {}
        labels = []
        for d, lbl in combo:
            kw.update(d)
            labels.append(lbl)
        out.append((kw, "[" + "-".join(labels) + "]"))
    return out


def _resolve(name, mod, tmpbase, fins, cache):
    if name in cache:
        return cache[name]
    if name == "tmp_path":
        p = Path(tmpbase) / ("t%d" % len(cache))
        p.mkdir(parents=True, exist_ok=True)
        val = p
    elif name in ("monkeypatch",):
        mp = _MonkeyPatch()
        fins.append(mp.undo)
        val = mp
    elif name == "capsys":
        cs = _CapSys()
        fins.append(cs._release)
        val = cs
    elif name == "tmp_path_factory":
        class _F:
            def mktemp(self, n):
                p = Path(tmpbase) / n
                p.mkdir(parents=True, exist_ok=True)
                return p
        val = _F()
    else:
        fx = getattr(mod, name, None)
        if fx is None or not getattr(fx, "_is_fixture", False):
            raise LookupError("fixture '" + name + "' not found")
        kw = {a: _resolve(a, mod, tmpbase, fins, cache) for a in _argnames(fx)}
        r = fx(**kw)
        if hasattr(r, "__next__"):
            gen = r
            val = next(gen)
            def _fin(g=gen):
                try:
                    next(g)
                except StopIteration:
                    pass
            fins.append(_fin)
        else:
            val = r
    cache[name] = val
    return val


def _argnames(fn):
    code = fn.__code__
    names = list(code.co_varnames[:code.co_argcount])
    return [n for n in names if n != "self"]


def mini_main(d, filenames):
    RUN["n"] += 1
    W = 70
    print("=" * 25 + " test session starts " + "=" * 24)
    print("platform emscripten -- Python " + sys.version.split()[0] + " -- mini-pytest (fallback)")
    print("rootdir: " + d)

    mods = []
    for fn in filenames:
        modname = fn[:-3]
        try:
            mod = __import__(modname)
            mods.append((fn, mod))
        except Exception:
            print("\nERROR collecting " + fn)
            traceback.print_exc(limit=2)
            return 2

    items = []
    for fname, mod in mods:
        for name, fn, cls in _collect(mod):
            for kw, label in _cases(fn):
                items.append((fname, mod, name + label, fn, cls, kw))

    print("collected " + str(len(items)) + " items\n")

    passed = failed = skipped = xfailed = 0
    failures = []
    progress = ""
    current_file = None

    for fname, mod, nodeid, fn, cls, kw in items:
        if current_file != fname:
            if current_file is not None:
                print("")
            print(fname + " ", end="")
            current_file = fname
        fins, cache = [], {}
        tmpbase = os.path.join(ROOT, "tmp%d" % RUN["n"], nodeid.replace("/", "_")[:40])
        os.makedirs(tmpbase, exist_ok=True)
        try:
            if getattr(fn, "_skip", None) is not None:
                skipped += 1
                print("s", end="")
                continue
            args = {}
            for a in _argnames(fn):
                if a in kw:
                    args[a] = kw[a]
                else:
                    args[a] = _resolve(a, mod, tmpbase, fins, cache)
            target = fn if cls is None else getattr(cls(), fn.__name__)
            target(**args)
            if getattr(fn, "_xfail", None) is not None:
                print("X", end="")
            else:
                passed += 1
                print(".", end="")
        except _Skipped:
            skipped += 1
            print("s", end="")
        except Exception as exc:
            if getattr(fn, "_xfail", None) is not None:
                xfailed += 1
                print("x", end="")
            else:
                failed += 1
                print("F", end="")
                tb = traceback.format_exc()
                failures.append((nodeid, type(exc).__name__, str(exc), tb))
        finally:
            for f in reversed(fins):
                try:
                    f()
                except Exception:
                    pass
    print("")

    if failures:
        print("\n" + "=" * 29 + " FAILURES " + "=" * 30)
        for nodeid, etype, emsg, tb in failures:
            pad = max(2, (W - len(nodeid) - 2) // 2)
            print("_" * pad + " " + nodeid + " " + "_" * pad)
            body = [l for l in tb.splitlines() if "mini_main" not in l and "site-packages" not in l]
            for line in body[2:]:
                print(line)
            print("E   " + etype + ": " + emsg)
            print("")

    parts = []
    if failed:
        parts.append(str(failed) + " failed")
    if passed:
        parts.append(str(passed) + " passed")
    if skipped:
        parts.append(str(skipped) + " skipped")
    if xfailed:
        parts.append(str(xfailed) + " xfailed")
    summary = ", ".join(parts) or "no tests ran"
    bar = "=" * max(3, (W - len(summary) - 2) // 2)
    print(bar + " " + summary + " " + bar)
    return 1 if failed else 0


# ==================================================== public API
def _purge(filenames):
    for fn in filenames:
        sys.modules.pop(fn[:-3], None)


def run_lab(payload):
    files = payload["files"]
    RUN["n"] += 1
    d = os.path.join(ROOT, "r%d" % RUN["n"])
    os.makedirs(d, exist_ok=True)
    for name, src in files.items():
        Path(d, name).write_text(src, encoding="utf-8")
    _purge(list(files))
    sys.path.insert(0, d)
    cwd = os.getcwd()
    buf = io.StringIO()
    o, e = sys.stdout, sys.stderr
    sys.stdout = sys.stderr = buf
    code = 3
    try:
        os.chdir(d)
        if ENGINE == "pytest":
            import pytest as _p
            code = int(_p.main(["-q", "--no-header", "--tb=short",
                                "-p", "no:cacheprovider", "-p", "no:randomly", d]))
        else:
            code = mini_main(d, [f for f in files if f.startswith("test_")])
    except SystemExit as se:
        code = int(getattr(se, "code", 1) or 0)
    except Exception:
        traceback.print_exc(file=buf)
        code = 3
    finally:
        os.chdir(cwd)
        sys.stdout, sys.stderr = o, e
        if d in sys.path:
            sys.path.remove(d)
        _purge(list(files))
    return {"code": code, "out": buf.getvalue(), "engine": ENGINE_LABEL}


def run_script(src):
    RUN["n"] += 1
    d = os.path.join(ROOT, "s%d" % RUN["n"])
    os.makedirs(d, exist_ok=True)
    buf = io.StringIO()
    o, e = sys.stdout, sys.stderr
    sys.stdout = sys.stderr = buf
    cwd = os.getcwd()
    code = 0
    try:
        os.chdir(d)
        g = {"__name__": "__main__", "__file__": "playground.py"}
        exec(compile(src, "playground.py", "exec"), g)
    except SystemExit:
        pass
    except Exception:
        code = 1
        tb = traceback.format_exc()
        lines = [l for l in tb.splitlines() if "run_script" not in l]
        print("\n".join(lines[1:]), file=buf)
    finally:
        os.chdir(cwd)
        sys.stdout, sys.stderr = o, e
    return {"code": code, "out": buf.getvalue(), "engine": ENGINE_LABEL}
`;

אין מערכת קבצים אמיתית, ולכן יש כאן מערכת קבצים וירטואלית בזיכרון,
ומריצים מודולים מתוך מחרוזות במקום לייבא מהדיסק.

import sys, io, re, json, types, itertools, traceback

# ============================================================ virtual FS
FS = {}
DIRS = {"/", "/work", "/tmp"}


def _norm(p):
    s = str(p).replace("\\", "/")
    if not s.startswith("/"):
        s = "/work/" + s
    while "//" in s:
        s = s.replace("//", "/")
    if len(s) > 1 and s.endswith("/"):
        s = s[:-1]
    return s


class VFile:
    def __init__(self, path, mode, buf):
        self.path, self.mode = path, mode
        self._buf = buf
        self._pos = 0
        self.closed = False

    def read(self, n=-1):
        data = self._buf[self._pos:]
        self._pos = len(self._buf)
        return data

    def readlines(self):
        return self.read().splitlines(True)

    def readline(self):
        rest = self._buf[self._pos:]
        if not rest:
            return ""
        i = rest.find("\n")
        line = rest if i < 0 else rest[:i + 1]
        self._pos += len(line)
        return line

    def write(self, s):
        self._buf += str(s)
        return len(str(s))

    def writelines(self, lines):
        for line in lines:
            self.write(line)

    def flush(self):
        if any(m in self.mode for m in ("w", "a", "x", "+")):
            FS[self.path] = self._buf

    def close(self):
        self.flush()
        self.closed = True

    def __enter__(self):
        return self

    def __exit__(self, *a):
        self.close()
        return False

    def __iter__(self):
        for line in self.read().splitlines():
            yield line + "\n"


def vopen(path, mode="r", encoding=None, newline=None, errors=None, buffering=-1):
    p = _norm(path)
    if "r" in mode and "+" not in mode:
        if p not in FS:
            raise FileNotFoundError("No such file or directory: '%s'" % p)
        return VFile(p, mode, FS[p])
    if "a" in mode:
        return VFile(p, mode, FS.get(p, ""))
    DIRS.add(p.rsplit("/", 1)[0] or "/")
    FS.setdefault(p, "")
    return VFile(p, mode, "")


class VPath:
    def __init__(self, *parts):
        joined = "/".join(str(x) for x in parts if str(x) != "")
        self._p = _norm(joined) if joined else "/work"

    # --- construction -------------------------------------------------
    def __truediv__(self, other):
        return VPath(self._p + "/" + str(other))

    def __rtruediv__(self, other):
        return VPath(str(other) + "/" + self._p)

    def __str__(self):
        return self._p

    def __repr__(self):
        return "PosixPath('%s')" % self._p

    def __fspath__(self):
        return self._p

    def __eq__(self, other):
        return str(other) == self._p

    def __hash__(self):
        return hash(self._p)

    # --- parts --------------------------------------------------------
    @property
    def name(self):
        return self._p.rsplit("/", 1)[-1]

    @property
    def stem(self):
        n = self.name
        return n.rsplit(".", 1)[0] if "." in n else n

    @property
    def suffix(self):
        n = self.name
        return "." + n.rsplit(".", 1)[1] if "." in n else ""

    @property
    def parent(self):
        head = self._p.rsplit("/", 1)[0]
        return VPath(head or "/")

    # --- queries ------------------------------------------------------
    def exists(self):
        return self._p in FS or self._p in DIRS

    def is_file(self):
        return self._p in FS

    def is_dir(self):
        return self._p in DIRS

    def stat(self):
        return types.SimpleNamespace(st_size=len(FS.get(self._p, "")))

    # --- mutation -----------------------------------------------------
    def mkdir(self, parents=False, exist_ok=False):
        if self._p in DIRS and not exist_ok:
            raise FileExistsError(self._p)
        parts = self._p.strip("/").split("/")
        acc = ""
        for part in parts:
            acc += "/" + part
            DIRS.add(acc)
        return None

    def write_text(self, data, encoding=None, errors=None, newline=None):
        DIRS.add(self.parent._p)
        FS[self._p] = str(data)
        return len(str(data))

    def read_text(self, encoding=None, errors=None):
        if self._p not in FS:
            raise FileNotFoundError("No such file or directory: '%s'" % self._p)
        return FS[self._p]

    def write_bytes(self, data):
        return self.write_text(data.decode("utf-8") if hasattr(data, "decode") else str(data))

    def read_bytes(self):
        return self.read_text().encode("utf-8")

    def unlink(self, missing_ok=False):
        if self._p in FS:
            del FS[self._p]
        elif not missing_ok:
            raise FileNotFoundError(self._p)

    def open(self, mode="r", encoding=None, newline=None, **kw):
        return vopen(self._p, mode, encoding, newline)

    # --- listing ------------------------------------------------------
    def _children(self, recursive):
        prefix = self._p.rstrip("/") + "/"
        for p in list(FS):
            if not p.startswith(prefix):
                continue
            rest = p[len(prefix):]
            if recursive or "/" not in rest:
                yield VPath(p)

    def iterdir(self):
        return list(self._children(False))

    def glob(self, pattern):
        rx = re.compile("^" + re.escape(pattern).replace("\\*", "[^/]*") + "$")
        return [p for p in self._children(False) if rx.match(p.name)]

    def rglob(self, pattern):
        rx = re.compile("^" + re.escape(pattern).replace("\\*", "[^/]*") + "$")
        return [p for p in self._children(True) if rx.match(p.name)]

class _Approx:
    def __init__(self, expected, rel=None, abs=None):
        self.expected, self.rel, self.abs = expected, rel, abs

    def _close(self, a, b):
        if self.abs is not None and abs(a - b) <= self.abs:
            return True
        tol = self.rel if self.rel is not None else 1e-6
        return abs(a - b) <= tol * max(abs(a), abs(b), 1e-12)

    def __eq__(self, other):
        e = self.expected
        try:
            if isinstance(e, dict):
                return set(e) == set(other) and all(self._close(other[k], e[k]) for k in e)
            if isinstance(e, (list, tuple)):
                return len(e) == len(other) and all(self._close(x, y) for x, y in zip(other, e))
            return self._close(other, e)
        except Exception:
            return False

    def __repr__(self):
        return "approx(%r)" % (self.expected,)


def _approx(expected, rel=None, abs=None):
    return _Approx(expected, rel, abs)


class _Raises:
    def __init__(self, expected, match=None):
        self.expected, self.match = expected, match
        self.value = None
        self.type = None

    def __enter__(self):
        return self

    def __exit__(self, et, ev, tb):
        if et is None:
            raise AssertionError("DID NOT RAISE " + repr(self.expected))
        if not issubclass(et, self.expected):
            return False
        if self.match and not re.search(self.match, str(ev)):
            raise AssertionError("regex %r does not match %r" % (self.match, str(ev)))
        self.value, self.type = ev, et
        return True


class _Param:
    def __init__(self, values, marks=None, id=None):
        self.values, self.marks, self.id = values, marks, id


def _param(*values, **k):
    return _Param(values, k.get("marks"), k.get("id"))


class _Mark:
    def __init__(self, name):
        self.name = name

    def __call__(self, *a, **k):
        if len(a) == 1 and not k and callable(a[0]) and not isinstance(a[0], (str, list, tuple)):
            return self._apply(a[0], (), {})

        def deco(fn):
            return self._apply(fn, a, k)
        return deco

    def _apply(self, fn, a, k):
        if self.name == "parametrize":
            names = a[0]
            if isinstance(names, str):
                names = [n.strip() for n in names.split(",") if n.strip()]
            fn._params = getattr(fn, "_params", []) + [(names, list(a[1]), k.get("ids"))]
        elif self.name == "skip":
            fn._skip = k.get("reason", "")
        elif self.name == "skipif":
            if (a[0] if a else k.get("condition", True)):
                fn._skip = k.get("reason", "")
        elif self.name == "xfail":
            fn._xfail = k.get("reason", "")
        else:
            fn._marks = getattr(fn, "_marks", []) + [self.name]
        return fn


class _MarkGen:
    def __getattr__(self, name):
        return _Mark(name)


class _Skipped(Exception):

def _fixture(*a, **k):
    if len(a) == 1 and callable(a[0]):
        a[0]._is_fixture = True
        return a[0]

    def deco(fn):
        fn._is_fixture = True
        fn._fx_params = k.get("params")
        return fn
    return deco


def _importorskip(name, *a, **k):
    try:
        return __import__(name)
    except ImportError:
        raise _Skipped("could not import " + name)


class MonkeyPatch:
    def __init__(self):
        self._undo = []

    def setattr(self, target, name, value=None):
        if isinstance(target, str):
            modname, _, attr = target.rpartition(".")
            target, name, value = sys.modules[modname], attr, name
        had = hasattr(target, name)
        old = getattr(target, name, None)
        self._undo.append(lambda: setattr(target, name, old) if had else None)
        setattr(target, name, value)

    def delattr(self, target, name, raising=True):
        if hasattr(target, name):
            old = getattr(target, name)
            self._undo.append(lambda: setattr(target, name, old))
            delattr(target, name)
        elif raising:
            raise AttributeError(name)

    def setenv(self, key, value):
        had = key in _os.environ
        old = _os.environ.get(key)
        self._undo.append(lambda: _os.environ.__setitem__(key, old) if had else _os.environ.pop(key, None))
        _os.environ[key] = str(value)

    def delenv(self, key, raising=True):
        if key in _os.environ:
            old = _os.environ[key]
            self._undo.append(lambda: _os.environ.__setitem__(key, old))
            del _os.environ[key]
        elif raising:
            raise KeyError(key)

    def setitem(self, d, key, value):
        had, old = key in d, d.get(key)
        self._undo.append(lambda: d.__setitem__(key, old) if had else d.pop(key, None))
        d[key] = value

    def chdir(self, path):
        pass

    def undo(self):
        for fn in reversed(self._undo):
            try:
                fn()
            except Exception:
                pass
        self._undo = []


class _Captured:
    def __init__(self, out, err):
        self.out, self.err = out, err


class _CapSys:
    def __init__(self):
        self._out = io.StringIO()
        self._old = sys.stdout
        sys.stdout = self._out

    def readouterr(self):
        o = self._out.getvalue()
        self._out.truncate(0)
        self._out.seek(0)
        return _Captured(o, "")

    def _release(self):
        sys.stdout = self._old

def _argnames(fn):
    names = []
    try:
        code = fn.__code__
        names = list(code.co_varnames[:code.co_argcount])
    except Exception:
        try:
            import inspect
            names = list(inspect.signature(fn).parameters)
        except Exception:
            names = []
    return [n for n in names if n not in ("self", "cls")]


def _collect(mod):
    items = []
    for name, obj in list(vars(mod).items()):
        if name.startswith("test_") and callable(obj) and not isinstance(obj, type):
            items.append((name, obj, None))
        elif name.startswith("Test") and isinstance(obj, type):
            for mn in dir(obj):
                if mn.startswith("test_"):
                    items.append((name + "::" + mn, getattr(obj, mn), obj))
    return items


def _cases(fn):
    stacks = list(reversed(getattr(fn, "_params", [])))
    if not stacks:
        return [({}, "")]
    grids = []
    for names, values, ids in stacks:
        row = []
        for i, v in enumerate(values):
            if isinstance(v, _Param):
                v = v.values[0] if len(v.values) == 1 else v.values
            vals = v if isinstance(v, (list, tuple)) and len(names) > 1 else (v,)
            label = ids[i] if ids and i < len(ids) else "-".join(str(x) for x in vals)
            row.append((dict(zip(names, vals)), label))
        grids.append(row)
    out = []
    for combo in itertools.product(*grids):
        kw, labels = {}, []
        for d, lbl in combo:
            kw.update(d)
            labels.append(lbl)
        out.append((kw, "[" + "-".join(labels) + "]"))
    return out


_TMP = {"n": 0}


def _resolve(name, mod, fins, cache):
    if name in cache:
        return cache[name]
    if name == "tmp_path":
        _TMP["n"] += 1
        p = VPath("/tmp/t%d" % _TMP["n"])
        p.mkdir(parents=True, exist_ok=True)
        val = p
    elif name == "tmp_path_factory":
        class _F:
            def mktemp(self, n):
                p = VPath("/tmp/" + str(n))
                p.mkdir(parents=True, exist_ok=True)
                return p
        val = _F()
    elif name == "monkeypatch":
        mp = MonkeyPatch()
        fins.append(mp.undo)
        val = mp
    elif name == "capsys":
        cs = _CapSys()
        fins.append(cs._release)
        val = cs
    else:
        fx = getattr(mod, name, None)
        if fx is None or not getattr(fx, "_is_fixture", False):
            raise LookupError("fixture '" + name + "' not found")
        kw = {a: _resolve(a, mod, fins, cache) for a in _argnames(fx)}
        r = fx(**kw)
        if hasattr(r, "__next__"):
            gen = r
            val = next(gen)

            def _fin(g=gen):
                try:
                    next(g)
                except StopIteration:
                    pass
            fins.append(_fin)
        else:
            val = r
    cache[name] = val
    return val


def _make_module(name, src, is_main=False):
    mod = types.ModuleType(name)
    mod.__dict__["__name__"] = "__main__" if is_main else name
    mod.__dict__["__file__"] = name + ".py"
    mod.__dict__["open"] = vopen
    mod.__dict__["Path"] = VPath
    sys.modules[name] = mod
    exec(compile(src, name + ".py", "exec"), mod.__dict__)
    return mod


def run_lab(payload):
    files = payload["files"]
    W = 70
    buf = io.StringIO()
    old = sys.stdout
    sys.stdout = buf
    passed = failed = skipped = xfailed = 0
    failures = []
    code = 0
    try:
        print("=" * 25 + " test session starts " + "=" * 24)
        print("platform brython -- mini-pytest (מנוע קל)")

        support = [f for f in files if not f.startswith("test_")]
        tests = [f for f in files if f.startswith("test_")]

        for fname in support:
            _make_module(fname[:-3], files[fname])

        mods = []
        for fname in tests:
            mods.append((fname, _make_module(fname[:-3], files[fname])))

        items = []
        for fname, mod in mods:
            for name, fn, cls in _collect(mod):
                for kw, label in _cases(fn):
                    items.append((fname, mod, name + label, fn, cls, kw))

        print("collected " + str(len(items)) + " items\n")

        current = None
        for fname, mod, nodeid, fn, cls, kw in items:
            if current != fname:
                if current is not None:
                    print("")
                print(fname + " ", end="")
                current = fname
            fins, cache = [], {}
            try:
                if getattr(fn, "_skip", None) is not None:
                    skipped += 1
                    print("s", end="")
                    continue
                args = {}
                for a in _argnames(fn):
                    args[a] = kw[a] if a in kw else _resolve(a, mod, fins, cache)
                target = fn if cls is None else getattr(cls(), fn.__name__)
                target(**args)
                if getattr(fn, "_xfail", None) is not None:
                    print("X", end="")
                else:
                    passed += 1
                    print(".", end="")
            except _Skipped:
                skipped += 1
                print("s", end="")
            except Exception as exc:
                if getattr(fn, "_xfail", None) is not None:
                    xfailed += 1
                    print("x", end="")
                else:
                    failed += 1
                    print("F", end="")
                    failures.append((nodeid, type(exc).__name__, str(exc), traceback.format_exc()))
            finally:
                for f in reversed(fins):
                    try:
                        f()
                    except Exception:
                        pass
        print("")

        if failures:
            print("\n" + "=" * 29 + " FAILURES " + "=" * 30)
            for nodeid, etype, emsg, tb in failures:
                pad = max(2, (W - len(nodeid) - 2) // 2)
                print("_" * pad + " " + nodeid + " " + "_" * pad)
                body = [l for l in tb.splitlines() if "run_lab" not in l and "_resolve" not in l]
                for line in body[2:]:
                    print(line)
                print("E   " + etype + ": " + emsg)
                print("")

        parts = []
        if failed:
            parts.append(str(failed) + " failed")
        if passed:
            parts.append(str(passed) + " passed")
        if skipped:
            parts.append(str(skipped) + " skipped")
        if xfailed:
            parts.append(str(xfailed) + " xfailed")
        summary = ", ".join(parts) or "no tests ran"
        bar = "=" * max(3, (W - len(summary) - 2) // 2)
        print(bar + " " + summary + " " + bar)
        code = 1 if failed else 0
    except Exception:
        traceback.print_exc(file=buf)
        code = 3
    finally:
        sys.stdout = old
        for f in list(files):
            sys.modules.pop(f[:-3], None)
    return {"code": code, "out": buf.getvalue(), "engine": ENGINE_LABEL}


def run_script(src):
    buf = io.StringIO()
    old = sys.stdout
    sys.stdout = buf
    code = 0
    try:
        g = {"__name__": "__main__", "__file__": "playground.py",
             "open": vopen, "Path": VPath}
        exec(compile(src, "playground.py", "exec"), g)
    except SystemExit:
        pass
    except BaseException:
        code = 1
        tb = traceback.format_exc()
        lines = [l for l in tb.splitlines() if "run_script" not in l]
        print("\n".join(lines[1:]), file=buf)
    finally:
        sys.stdout = old
    return {"code": code, "out": buf.getvalue(), "engine": ENGINE_LABEL}

        return run_script(payload["src"])
    return run_lab(payload)

const Bry = {
  status: "idle",          // idle | loading | ready | failed
  label: "",
  reason: "",
  _promise: null,
  _n: 0,

  ensure(log) {
    if (this.status === "ready") return Promise.resolve(true);
    if (this.status === "failed" && !this.retryable) return Promise.resolve(false);
    if (this.status === "failed") { this.status = "idle"; this._promise = null; this.retryable = false; }
    if (this._promise) return this._promise;

    this._promise = (async () => {
      this.status = "loading";
      for (const [core, stdlib] of BRYTHON_SOURCES) {
        try {
          log("טוען מנוע פייתון קל: " + core);
          await Py.loadScript(core);
          await Py.loadScript(stdlib);
          if (typeof window.brython === "function") {
            this.label = "mini-pytest · Brython (מנוע קל)";
            this.status = "ready";
            log("מוכן: " + this.label);
            return true;
          }
        } catch (e) { /* ננסה את המקור הבא */ }
      }
      this.status = "failed";
      this.retryable = true;
      this.reason = "לא הצלחנו לטעון את מנוע הפייתון הקל — כנראה אין חיבור לרשת.";
      log(this.reason);
      return false;
    })();
    return this._promise;
  },

  call(payload) {
    window.__PY_SRC = JSON.stringify(payload);
    window.__PY_DONE = false;
    window.__PY_OUT = "";
    window.__PY_CODE = 3;

    // Brython כותב שגיאות לקונסול. לוכדים אותן כדי שיהיה מה להראות.
    const logs = [];
    const orig = { log: console.log, error: console.error, warn: console.warn };
    const grab = fn => (...a) => {
      try { logs.push(a.map(x => (typeof x === "string" ? x : String(x))).join(" ")); } catch (e) {}
      try { fn.apply(console, a); } catch (e) {}
    };
    console.log = grab(orig.log);
    console.error = grab(orig.error);
    console.warn = grab(orig.warn);

    const onErr = ev => { logs.push("window.onerror: " + (ev.message || ev)); };
    window.addEventListener("error", onErr);

    const el = document.createElement("script");
    el.type = "text/python";
    el.id = "bry_run_" + (this._n++);
    el.textContent = BRY_BOOT;

    const cleanup = () => {
      console.log = orig.log; console.error = orig.error; console.warn = orig.warn;
      window.removeEventListener("error", onErr);
      el.remove();
    };

    return (async () => {
      try {
        document.body.appendChild(el);
        try {
          window.brython({ debug: 1 });
        } catch (e) {
          logs.push("brython(): " + (e && e.message ? e.message : String(e)));
        }

        // ההרצה עשויה להיות אסינכרונית — ממתינים לדגל הסיום
        const deadline = Date.now() + 20000;
        while (!window.__PY_DONE && Date.now() < deadline) {
          await new Promise(r => setTimeout(r, 40));
        }

        if (!window.__PY_DONE) {
          const tail = logs.filter(Boolean).slice(-25).join("\n");
          const err = new Error("ההרצה לא הסתיימה");
          err.detail = tail || "(המנוע לא החזיר שום הודעה)";
          throw err;
        }

        return {
          code: window.__PY_CODE,
          out: window.__PY_OUT,
          engine: window.__PY_ENGINE || this.label
        };
      } finally {
        cleanup();
      }
    })();
  }
};

const KEY = "pytest-track-v1";

const store = {
  async read() {
    try { if (window.storage) { const r = await window.storage.get(KEY, false); if (r && r.value) return JSON.parse(r.value); } } catch (e) {}
    try { const v = localStorage.getItem(KEY); if (v) return JSON.parse(v); } catch (e) {}
    return mem[KEY] || null;
  },
  async write(obj) {
    const s = JSON.stringify(obj);
    mem[KEY] = obj;
    try { if (window.storage) { await window.storage.set(KEY, s, false); return; } } catch (e) {}
    try { localStorage.setItem(KEY, s); } catch (e) {}
  }
};

const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

function inline(text) {
  return esc(text)
    .replace(/`([^`]+)`/g, '<code class="inline">$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\n/g, "<br>");
}

/* ============================================================
   syntax highlighting
   ============================================================ */
const PY_KW = "False|None|True|and|as|assert|async|await|break|class|continue|def|del|elif|else|except|finally|for|from|global|if|import|in|is|lambda|nonlocal|not|or|pass|raise|return|try|while|with|yield|self|cls";
const PY_BI = "print|len|range|int|str|float|bool|list|dict|set|tuple|open|sum|min|max|sorted|enumerate|zip|isinstance|type|super|abs|round|map|filter|any|all|getattr|setattr|hasattr|repr|Exception|ValueError|TypeError|KeyError|IndexError|AttributeError|ZeroDivisionError|TimeoutError|FileNotFoundError|NotImplementedError";

function hlPython(src) {
  const re = new RegExp(
    '("""[\\s\\S]*?"""|\'\'\'[\\s\\S]*?\'\'\'|[frbu]?"(?:[^"\\\\\\n]|\\\\.)*"|[frbu]?\'(?:[^\'\\\\\\n]|\\\\.)*\')' +
    '|(#[^\\n]*)' +
    '|(@[A-Za-z_][\\w.]*)' +
    '|\\b(' + PY_KW + ')\\b' +
    '|\\b(' + PY_BI + ')\\b' +
    '|\\b(\\d+(?:\\.\\d+)?)\\b' +
    '|\\b([A-Za-z_]\\w*)(?=\\s*\\()', 'g');

  return esc(src).replace(re, (m, str, com, dec, kw, bi, num, fn) => {
    if (str) return '<span class="t-str">' + m + '</span>';
    if (com) return '<span class="t-com">' + m + '</span>';
    if (dec) return '<span class="t-dec">' + m + '</span>';
    if (kw)  return '<span class="t-kw">' + m + '</span>';
    if (bi)  return '<span class="t-bi">' + m + '</span>';
    if (num) return '<span class="t-num">' + m + '</span>';
    if (fn)  return '<span class="t-fn">' + m + '</span>';
    return m;
  });
}

function hlBash(src) {
  return esc(src).split("\n").map(line => {
    if (/^\s*#/.test(line)) return '<span class="t-com">' + line + "</span>";
    return line
      .replace(/(^|\s)(--?[A-Za-z][\w-]*)/g, '$1<span class="t-dec">$2</span>')
      .replace(/^(pytest|pip|python|mkdir|cd|source|export|tox|ruff|mypy)\b/, '<span class="t-kw">$1</span>');
  }).join("\n");
}

function hlIni(src) {
  return esc(src).split("\n").map(line => {
    if (/^\s*[#;]/.test(line)) return '<span class="t-com">' + line + "</span>";
    if (/^\s*\[/.test(line)) return '<span class="t-dec">' + line + "</span>";
    return line.replace(/^([\w.-]+)(\s*=)/, '<span class="t-fn">$1</span>$2')
               .replace(/(&quot;[^&]*?&quot;)/g, '<span class="t-str">$1</span>');
  }).join("\n");
}

function hlOutput(src) {
  return esc(src).split("\n").map(line => {
    if (/^\$ /.test(line))
      return '<span class="o-dim">$</span> <span class="o-cmd">' + line.slice(2) + "</span>";
    if (/^&gt;&gt;&gt; /.test(line))
      return '<span class="o-dim">&gt;&gt;&gt;</span> <span class="o-cmd">' + line.slice(12) + "</span>";
    if (/^E\s/.test(line) || /FAILED|FAILURES|AssertionError|Error/.test(line))
      return '<span class="o-fail">' + line + "</span>";
    if (/PASSED|passed/.test(line))
      return line.replace(/(PASSED|\d+ passed)/g, '<span class="o-pass">$1</span>');
    if (/SKIPPED|skipped|XFAIL|xfailed|warning/i.test(line))
      return '<span class="o-warn">' + line + "</span>";
    if (/^[=_\-]{5,}/.test(line) || /^\s*$/.test(line))
      return '<span class="o-dim">' + line + "</span>";
    if (/^&gt;\s/.test(line))
      return '<span class="o-cmd">' + line + "</span>";
    return '<span class="o-dim">' + line + "</span>";
  }).join("\n");
}

  return "";

    <h1 class="title">${esc(L.title)}</h1>
    <p class="lede">${inline(L.lede)}</p>
    ${body}
    ${extraLab}
    <button class="done-btn" id="doneBtn" data-on="${status ? 1 : 0}">
      ${status ? "✓ השיעור סומן כהושלם" : "סמן שיעור זה כהושלם"}
    </button>`;

  const prev = FLAT[L.n - 1], next = FLAT[L.n + 1];
  $("nav").innerHTML = `
    <button class="nav-btn" ${prev ? "" : "disabled"} data-go="${prev ? prev.id : ""}">
      <span class="nav-k">→ הקודם</span>
      <span class="nav-l">${prev ? esc(prev.title) : "זו ההתחלה"}</span>
    </button>
    <button class="nav-btn" ${next ? "" : "disabled"} data-go="${next ? next.id : ""}">
      <span class="nav-k">הבא ←</span>
      <span class="nav-l">${next ? esc(next.title) : "סיימת את המסלול"}</span>
    </button>`;

  window.scrollTo({ top: 0, behavior: "instant" });
  renderTree();
  renderDots();
}

function glyphFor(id) {
  const s = state.status[id];
  if (s === "pass")  return ['<span class="glyph g-pass">.</span>', "d-pass", "."];
  if (s === "xfail") return ['<span class="glyph g-xfail">x</span>', "d-xfail", "x"];
  return ['<span class="glyph g-pending">·</span>', "d-pending", "·"];
}

function renderTree() {
  const q = ($("search").value || "").trim().toLowerCase();

  if (q) {
    const hits = FLAT.filter(l =>
      (l.title + " " + l.tag + " " + l.lede + " " + JSON.stringify(l.blocks)).toLowerCase().includes(q)
    );
    $("tree").innerHTML = hits.length
      ? '<ul class="results">' + hits.map(l =>
          `<li><button class="res-btn" data-go="${l.id}">
             <span class="res-mod">${esc(l.mod.idx)} · ${esc(l.tag)}</span>${esc(l.title)}</button></li>`).join("") + "</ul>"
      : `<div class="empty">אין שיעור שתואם ל"${esc(q)}".<br>נסה מונח אחר — למשל fixture, parametrize, monkeypatch או ‎-k.</div>`;
    return;
  }

  $("tree").innerHTML = COURSE.map((m, mi) => {
    const open = m.lessons.some(l => l.id === state.current) ? " open" : "";
    const items = m.lessons.map(l => {
      const [g] = glyphFor(l.id);
      return `<li><button class="lesson-btn" data-go="${l.id}" aria-current="${l.id === state.current}">
        ${g}<span>${esc(l.title)}</span></button></li>`;
    }).join("");
    const done = m.lessons.filter(l => state.status[l.id]).length;
    return `<details class="mod"${open}>
      <summary style="list-style:none">
        <div class="mod-btn">
          <span class="mod-idx">${esc(m.idx)}</span>
          <span>${esc(m.title)}</span>
          <span class="mod-chev">${done}/${m.lessons.length} ›</span>
        </div>
      </summary>
      <ul class="mod-list">${items}</ul>
    </details>`;
  }).join("");
}

let lastDots = "";
function renderDots(popId) {
  const chars = FLAT.map(l => {
    const [, cls, ch] = glyphFor(l.id);
    const here = l.id === state.current;
    const pop = l.id === popId ? " pop" : "";
    return `<span class="${here ? "d-here" : cls}${pop}" data-go="${l.id}" title="${esc(l.title)}">${here ? ">" : ch}</span>`;
  }).join("");
  $("dots").innerHTML = chars;

  const pass = FLAT.filter(l => state.status[l.id] === "pass").length;
  const xf = FLAT.filter(l => state.status[l.id] === "xfail").length;
  const pend = FLAT.length - pass - xf;
  const pct = Math.round(((pass + xf) / FLAT.length) * 100);

  const parts = [];
  if (pass) parts.push(pass + " passed");
  if (xf) parts.push(xf + " xfailed");
  if (pend) parts.push(pend + " pending");
  $("sessionHead").textContent =
    `collected ${FLAT.length} items — ${parts.join(", ")} [${pct}%]`;
}

/* ============================================================
   actions
   ============================================================ */
function go(id) {
  if (!id) return;
  state.current = id;
  save();
  renderLesson();
  closeDrawer();
}

function markDone(id, ok) {
  const prev = state.status[id];
  state.status[id] = ok === false ? "xfail" : (prev === "xfail" ? "xfail" : "pass");
  save();
  renderDots(id);
  renderTree();
  const btn = $("doneBtn");
  if (btn) { btn.dataset.on = "1"; btn.textContent = "✓ השיעור סומן כהושלם"; }
}

function closeDrawer() {
  $("sidebar").classList.remove("open");
  $("scrim").classList.remove("on");
}

/* ============================================================
   events
   ============================================================ */
document.addEventListener("click", e => {
  const goEl = e.target.closest("[data-go]");
  if (goEl && goEl.dataset.go) { go(goEl.dataset.go); return; }

  const copyEl = e.target.closest("[data-copy]");
  if (copyEl) {
    const text = codeStore[+copyEl.dataset.copy];
    const done = () => { copyEl.textContent = "הועתק ✓"; setTimeout(() => copyEl.textContent = "העתק", 1400); };
    if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, done);
    else {
      const ta = document.createElement("textarea");
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); } catch (err) {}
      ta.remove(); done();
    }
    return;
  }

  const sol = e.target.closest("[data-sol]");
  if (sol) {
    const box = document.getElementById(sol.dataset.sol);
    const open = box.classList.toggle("hidden");
    sol.textContent = open ? "הצג פתרון" : "הסתר פתרון";
    return;
  }

  const opt = e.target.closest(".opt");
  if (opt && !opt.disabled) {
    const quiz = document.getElementById(opt.dataset.quiz);
    const correct = +opt.dataset.correct;
    const chosen = +opt.dataset.i;
    quiz.querySelectorAll(".opt").forEach((b, i) => {
      b.disabled = true;
      if (i === correct) b.classList.add("right");
      else if (i === chosen) b.classList.add("wrong");
    });
    quiz.querySelector(".quiz-fb").classList.remove("hidden");
    markDone(opt.dataset.lesson, chosen === correct);
    return;
  }

  if (e.target.closest("#doneBtn")) {
    const L = state.current;
    if (state.status[L]) { delete state.status[L]; save(); renderDots(); renderTree();
      const b = $("doneBtn"); b.dataset.on = "0"; b.textContent = "סמן שיעור זה כהושלם"; }
    else markDone(L, true);
    return;
  }

  if (e.target.closest("#menuBtn")) {
    $("sidebar").classList.add("open"); $("scrim").classList.add("on"); return;
  }
  if (e.target.id === "scrim") { closeDrawer(); return; }

  if (e.target.closest("#themeBtn")) {
    state.theme = state.theme === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = state.theme;
    save();
  }
});

$("search").addEventListener("input", renderTree);

document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") {
    if (e.key === "Escape") { e.target.value = ""; renderTree(); e.target.blur(); }
    return;
  }
  const L = FLAT.find(l => l.id === state.current);
  if (e.key === "ArrowLeft" && FLAT[L.n + 1]) go(FLAT[L.n + 1].id);
  if (e.key === "ArrowRight" && FLAT[L.n - 1]) go(FLAT[L.n - 1].id);
  if (e.key === "/") { e.preventDefault(); $("search").focus(); }
});

/* ============================================================
   boot
   ============================================================ */
(async function boot() {
  const saved = await store.read();
  if (saved) state = { ...state, ...saved };
  if (!FLAT.some(l => l.id === state.current)) state.current = FLAT[0].id;
  document.documentElement.dataset.theme = state.theme || "dark";
  renderLesson();
})();
