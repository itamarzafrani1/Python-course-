/* ============================================================
   python runtime — lazy, with graceful degradation
   ============================================================ */
function wasmBlocked() {
  try {
    if (typeof WebAssembly === "undefined") return true;
    new WebAssembly.Module(new Uint8Array([0, 97, 115, 109, 1, 0, 0, 0]));
    return false;
  } catch (e) {
    return true;
  }
}

const inFrame = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();

/* התצוגה המוטמעת של ארטיפקטים מזוהה לפי window.storage שמוזרק אליה,
   או לפי origin חסום. שם ה-instantiation של Pyodide נכשל תמיד. */
const inSandbox = inFrame && (
  (typeof window.storage === "object" && window.storage !== null) ||
  location.origin === "null" ||
  location.protocol === "blob:" ||
  location.protocol === "about:"
);

/* בדיקה אסינכרונית אמיתית — קומפילציה של מודול זעיר עוברת גם איפה
   ש-instantiate נחסם, ולכן בודקים את שני השלבים. */
async function wasmUsable() {
  try {
    const bytes = new Uint8Array([
      0, 97, 115, 109, 1, 0, 0, 0,
      1, 5, 1, 96, 0, 1, 127,
      3, 2, 1, 0,
      7, 5, 1, 1, 102, 0, 0,
      10, 6, 1, 4, 0, 65, 42, 11
    ]);
    const { instance } = await WebAssembly.instantiate(bytes, {});
    return instance.exports.f() === 42;
  } catch (e) {
    return false;
  }
}

const Py = {
  status: "idle",           // idle | loading | ready | failed
  label: "",
  reason: "",
  pyodide: null,
  _promise: null,

  loadScript(src) {
    return new Promise((res, rej) => {
      const s = document.createElement("script");
      const timer = setTimeout(() => rej(new Error("timeout " + src)), 30000);
      s.src = src;
      s.onload = () => { clearTimeout(timer); res(); };
      s.onerror = () => { clearTimeout(timer); rej(new Error(src)); };
      document.head.appendChild(s);
    });
  },

  ensure(log) {
    if (this.status === "ready") return Promise.resolve(true);
    if (this.status === "failed" && !this.retryable) return Promise.resolve(false);
    if (this.status === "failed") { this.status = "idle"; this._promise = null; this.retryable = false; }
    if (this._promise) return this._promise;

    this._promise = (async () => {
      this.status = "loading";

      if (inSandbox) {
        this.status = "failed";
        this.reason = "אתה צופה בקובץ בתוך תצוגה מוטמעת, שחוסמת את טעינת מנוע הפייתון. " +
          "הורד את הקובץ ופתח אותו ישירות בדפדפן — שם ההרצה עובדת.";
        log(this.reason);
        return false;
      }

      if (wasmBlocked() || !(await wasmUsable())) {
        this.status = "failed";
        this.reason = "הדפדפן או הסביבה הזו חוסמים הרצת WebAssembly, ולכן אי אפשר להריץ פייתון כאן.";
        log(this.reason);
        return false;
      }

      let base = null;
      for (const src of PYODIDE_SOURCES) {
        try {
          log("מאתר מנוע פייתון: " + src);
          await this.loadScript(src);
          if (window.loadPyodide) { base = src.replace(/pyodide\.js$/, ""); break; }
        } catch (e) { /* try next */ }
      }
      if (!base) {
        this.status = "failed";
        this.reason = "לא הצלחנו להוריד את Pyodide — כנראה אין חיבור לרשת.";
        log(this.reason + " עוברים לבודק המבני.");
        return false;
      }
      const boot = () => Promise.race([
        window.loadPyodide({ indexURL: base }),
        new Promise((_, rej) => setTimeout(() => rej(new Error("אתחול Python לא הסתיים בתוך 90 שניות")), 90000))
      ]);

      try {
        log("מאתחל Python… (הורדה חד-פעמית, מספר עשרות MB)");
        try {
          this.pyodide = await boot();
        } catch (first) {
          // ניסיון שני: הורדה שנקטעה או לחץ זיכרון רגעי הם התקלה הנפוצה
          log("הניסיון הראשון נכשל (" + first.message + "). מנסה שוב…");
          await new Promise(r => setTimeout(r, 1500));
          this.pyodide = await boot();
        }
        try {
          log("מתקין pytest…");
          await this.pyodide.loadPackage("micropip");
          const mp = this.pyodide.pyimport("micropip");
          await mp.install("pytest");
        } catch (e) {
          log("pytest לא זמין — משתמשים במנוע המוקטן המובנה.");
        }
        this.pyodide.runPython(PY_BOOT);
        this.label = this.pyodide.runPython("ENGINE_LABEL");
        this.status = "ready";
        log("מוכן: " + this.label);
        return true;
      } catch (e) {
        this.status = "failed";
        const oom = /exit\(1\)|terminated|memory|Aborted|RangeError/i.test(e.message || "");
        this.reason = oom
          ? "מנוע הפייתון לא הצליח לעלות — כמעט תמיד בגלל מחסור זיכרון או הורדה שנקטעה."
          : "אתחול Python נכשל: " + e.message;
        this.retryable = true;
        this.hints = oom ? [
          "התחבר ל-Wi-Fi — ההורדה היא כ-25MB ורשת סלולרית נוטה לקטוע אותה",
          "סגור לשוניות ואפליקציות אחרות ברקע כדי לפנות זיכרון",
          "נסה לפתוח את האתר בלשונית Safari רגילה במקום מהאייקון במסך הבית",
          "אם זה נמשך — הפעל מחדש את המכשיר ונסה שוב"
        ] : null;
        log(this.reason);
        return false;
      }
    })();
    return this._promise;
  },

  call(fn, payload) {
    this.pyodide.globals.set("_PAYLOAD", JSON.stringify(payload));
    const out = this.pyodide.runPython(
      '__import__("json").dumps(' + fn + '(__import__("json").loads(_PAYLOAD)))'
    );
    return JSON.parse(out);
  }
};


/* ============================================================
   ENGINE — בוחר בין המנוע הקל (Brython) למלא (Pyodide)
   ברירת המחדל היא הקל: הוא עולה בכל מכשיר.
   ============================================================ */
const Engine = {
  reason: "",
  hints: null,

  mode() { return state.engine === "full" ? "full" : "light"; },
  active() { return this.mode() === "light" ? Bry : Py; },
  status() { return this.active().status; },
  label() { return this.active().label; },

  async ensure(log) {
    this.reason = ""; this.hints = null;

    if (this.mode() === "light") {
      const ok = await Bry.ensure(log);
      if (!ok) this.reason = Bry.reason;
      return ok;
    }

    const ok = await Py.ensure(log);
    if (ok) return true;

    log("");
    log("המנוע המלא לא זמין — עוברים אוטומטית למנוע הקל.");
    state.engine = "light"; save();
    const ok2 = await Bry.ensure(log);
    if (!ok2) { this.reason = Py.reason || Bry.reason; this.hints = Py.hints; }
    return ok2;
  },

  async runScript(src) {
    return this.mode() === "light"
      ? await Bry.call({ kind: "script", src })
      : Py.call("run_script", src);
  },

  async runLab(files) {
    return this.mode() === "light"
      ? await Bry.call({ kind: "lab", files })
      : Py.call("run_lab", { files });
  }
};

const engineBadge = () => {
  const st = Engine.status();
  if (st === "ready") return Engine.label();
  if (st === "loading") return "טוען מנוע…";
  if (st === "failed") return "בודק מבני (ללא הרצה)";
  return Engine.mode() === "light" ? "מנוע קל · ייטען בהרצה הראשונה"
                                   : "מנוע מלא · ייטען בהרצה הראשונה";
};

/* ============================================================
   lab panel
   ============================================================ */
function stripComments(src) {
  return src.replace(/"""[\s\S]*?"""/g, "").replace(/'''[\\s\\S]*?'''/g, "").replace(/#.*$/gm, "");
}

function isStub(bare, starter) {
  if (!bare.trim()) return true;
  if (/^[ \\t]*\\.\\.\\.[ \\t]*$/m.test(bare)) return true;
  return bare.replace(/\\s+/g, "") === stripComments(starter).replace(/\\s+/g, "");
}

function labCode(id) {
  state.code = state.code || {};
  return state.code[id] !== undefined ? state.code[id] : LABS[id].starter;
}

function renderLabPanel(lessonId) {
  const lab = LABS[lessonId];
  if (!lab) return "";
  return `<div class="lab" data-lab="${lessonId}">
    <div class="lab-head">
      <span class="lab-t">${lab.mode === "test" ? "כתוב את הבדיקה והרץ"
        : lab.mode === "output" ? "כתוב קוד והשווה פלט" : "כתוב את המימוש והרץ"}</span>
      <span class="lab-engine" data-engine="${lessonId}">${esc(engineBadge())}</span>
    </div>
    ${lab.mode === "output" ? `<div class="expected"><div class="mini-t">הפלט שצריך לצאת</div><pre class="lab-out">${esc(lab.expected)}</pre></div>` : ""}
    <textarea class="lab-code" dir="ltr" spellcheck="false" data-code="${lessonId}"
      aria-label="עורך קוד">${esc(labCode(lessonId))}</textarea>
    <div class="lab-actions">
      <button class="run-btn" data-run="${lessonId}">${lab.mode === "output" ? "▶ הרץ והשווה" : "▶ הרץ בדיקות"}</button>
      <button class="reveal" data-resetlab="${lessonId}">אפס לקוד ההתחלתי</button>
    </div>
    <div data-result="${lessonId}"></div>
  </div>`;
}

function renderStandaloneLab(lessonId) {
  const lab = LABS[lessonId];
  if (!lab || !lab.task) return "";
  const sid = "sol_" + lessonId;
  return `<div class="ex" style="margin-top:34px">
    <div class="ex-t">תרגיל קוד · ניתן להרצה</div>
    <p>${inline(lab.task)}</p>
    ${renderLabPanel(lessonId)}
    <div style="margin-top:14px"><button class="reveal" data-sol="${sid}">הצג פתרון</button></div>
    <div class="hidden" id="${sid}" style="margin-top:12px">${codeBlock("py", "פתרון", lab.solution || "")}</div>
  </div>`;
}

const normOut = s => String(s).replace(/\r/g, "").trim().split("\n").map(l => l.replace(/\s+$/, ""));

function diffBox(expected, actual) {
  const e = normOut(expected), a = normOut(actual);
  const n = Math.max(e.length, a.length);
  let rows = "";
  for (let i = 0; i < n; i++) {
    const le = e[i], la = a[i];
    if (le === la) {
      rows += `<span class="d-same">  ${esc(le)}</span>\n`;
    } else {
      if (le !== undefined) rows += `<span class="d-exp">✓ ${esc(le)}</span>\n`;
      if (la !== undefined) rows += `<span class="d-got">✗ ${esc(la)}</span>\n`;
    }
  }
  return `<pre class="lab-out">${rows}</pre>`;
}

function labOutBox(id, text) {
  return `<pre class="lab-out">${hlOutput(text)}</pre>`;
}

function verdict(kind, title, body, hints) {
  const icon = kind === "ok" ? "✓" : kind === "bad" ? "✕" : "!";
  const list = hints && hints.length
    ? '<ul class="hint-list">' + hints.map(h => "<li>" + esc(h) + "</li>").join("") + "</ul>"
    : "";
  return `<div class="verdict ${kind}"><span>${icon}</span><div><b>${esc(title)}</b>${esc(body || "")}${list}</div></div>`;
}

function countPassed(out) {
  const m = out.match(/(\d+)\s+passed/);
  return m ? +m[1] : 0;
}

async function runLab(lessonId) {
  const lab = LABS[lessonId];
  const target = document.querySelector(`[data-result="${lessonId}"]`);
  const btn = document.querySelector(`[data-run="${lessonId}"]`);
  const badge = document.querySelector(`[data-engine="${lessonId}"]`);
  const code = document.querySelector(`[data-code="${lessonId}"]`).value;

  state.code = state.code || {};
  state.code[lessonId] = code;
  save();

  btn.disabled = true;
  btn.textContent = "מריץ…";
  const logLines = [];
  const log = msg => {
    logLines.push(msg);
    target.innerHTML = labOutBox(lessonId, logLines.join("\n"));
    if (badge) badge.textContent = engineBadge();
  };

  // structural requirements are matched against real code, not comments
  const bare = stripComments(code);
  const missing = (lab.require || []).filter(r => !r[0].test(bare)).map(r => r[1]);

  if (isStub(bare, lab.starter)) {
    target.innerHTML = verdict("warn", "עוד לא נכתב קוד",
      "החלף את ה-‎...‎ בקוד שלך ולחץ שוב על הרצה. אם נתקעת — כפתור \"הצג פתרון\" נמצא ממש מתחת.");
    btn.disabled = false;
    btn.textContent = "▶ הרץ בדיקות";
    return;
  }

  const ready = await Engine.ensure(log);
  if (badge) badge.textContent = engineBadge();

  try {
    if (!ready) {
      fallbackCheck(lessonId, code, target);
      return;
    }

    if (lab.mode === "output") {
      const res = await Engine.runScript(code);
      const actual = res.out;
      let html = "";
      if (res.code !== 0) {
        html = labOutBox(lessonId, actual.trim() || "(אין פלט)") +
          verdict("bad", "הקוד קרס", "תקן את השגיאה שמופיעה למעלה ונסה שוב.");
      } else if (normOut(actual).join("\n") === normOut(lab.expected).join("\n")) {
        html = labOutBox(lessonId, actual.trim() || "(אין פלט)") +
          verdict("ok", "הפלט זהה לצפוי", "בדיוק כמו שצריך.");
        markDone(lessonId, true);
      } else {
        html = `<div class="mini-t" style="margin-top:12px">השוואה — ✓ מצופה · ✗ קיבלת</div>` +
          diffBox(lab.expected, actual) +
          verdict("bad", "הפלט שונה מהצפוי",
            "השורות באדום הן מה שהקוד שלך הדפיס בפועל. שים לב לרווחים, לפורמט המספרים ולסדר השורות.");
      }
      target.innerHTML = html;
      return;
    }

    const files = lab.mode === "impl"
      ? Object.assign({}, { [lab.file]: code, "test_lab.py": lab.tests })
      : Object.assign({}, lab.support || {}, { [lab.file]: code });

    const main = await Engine.runLab(files);
    let html = labOutBox(lessonId, main.out.trim() || "(אין פלט)");
    const passed = countPassed(main.out);

    if (main.code !== 0) {
      html += verdict("bad", "הבדיקות נכשלו", "קרא את שורות ה-E בפלט — הן מראות בדיוק מה קיבלנו מול מה שציפינו.");
    } else if (missing.length) {
      html += verdict("warn", "עובר, אבל לא בדרך שביקשנו", "", missing);
    } else if (lab.minTests && passed < lab.minTests) {
      html += verdict("warn", "חסרות בדיקות",
        `ציפינו לפחות ל-${lab.minTests} בדיקות שעוברות, ונאספו ${passed}.`);
    } else if (lab.mutant) {
      log("");
      const mutFiles = Object.assign({}, lab.mutant, { [lab.file]: code });
      const mut = await Engine.runLab(mutFiles);
      html = labOutBox(lessonId, main.out.trim());
      if (mut.code === 0) {
        html += verdict("warn", "הבדיקה עוברת — אבל גם על קוד שבור",
          "הרצנו את הבדיקה שלך מול גרסה עם באג מכוון, והיא עדיין עברה. סימן שהיא לא באמת מאמתת את ההתנהגות.");
        html += `<div style="margin-top:10px">${labOutBox(lessonId, "# הרצה מול הקוד השבור:\n" + mut.out.trim())}</div>`;
      } else {
        html += verdict("ok", "עבר — וגם תפס את הבאג",
          "הבדיקה שלך עוברת על הקוד התקין ונכשלת על גרסה עם באג מכוון. זו בדיוק בדיקה טובה.");
        markDone(lessonId, true);
      }
    } else {
      html += verdict("ok", "עבר", "כל הבדיקות ירוקות.");
      markDone(lessonId, true);
    }
    target.innerHTML = html;
  } catch (e) {
    target.innerHTML = labOutBox(lessonId, "שגיאה בהרצה: " + e.message + (e.detail ? "\n\n" + e.detail : ""));
  } finally {
    btn.disabled = false;
    btn.textContent = "▶ הרץ בדיקות";
  }
}

/* ---------- tier 3: static checker, no python at all ---------- */
function fallbackCheck(lessonId, code, target) {
  const lab = LABS[lessonId];
  const checks = lab.jsChecks || [];
  const bare = stripComments(code);
  const failed = checks.filter(c => !c[0].test(bare));
  const body = bare.trim();

  const sim = [
    "========================= structural check =========================",
    "engine: static (ללא הרצת פייתון)",
    "",
    checks.map(c => (c[0].test(bare) ? "." : "F")).join("") + "  [" + checks.length + " checks]",
    ""
  ];

  if (isStub(bare, lab.starter)) {
    target.innerHTML = labOutBox(lessonId, sim.join("\n")) +
      verdict("warn", "עוד לא נכתב קוד", "החלף את ה-`...` במימוש שלך ולחץ שוב על הרצה.");
    return;
  }

  sim.push(failed.length
    ? "===================== " + failed.length + " checks failed ====================="
    : "======================== all checks passed ========================");

  target.innerHTML = labOutBox(lessonId, sim.join("\n")) + (
    failed.length
      ? verdict("bad", "הקוד לא עומד בדרישות", "", failed.map(f => f[1]))
      : verdict("ok", "עומד בכל הדרישות המבניות",
          "שים לב: זו בדיקה של מבנה הקוד בלבד, לא הרצה. " + (Engine.reason || ""), Engine.hints)
  );
  if (!failed.length) markDone(lessonId, true);
}


/* ============================================================
   playground
   ============================================================ */
const PG_KEY = "__playground";

function buildPlayground() {
  const scrim = document.createElement("div");
  scrim.className = "pg-scrim";
  scrim.id = "pgScrim";

  const pg = document.createElement("aside");
  pg.className = "pg";
  pg.id = "pg";
  pg.innerHTML = `
    <div class="pg-bar">
      <span class="pg-title">מגרש משחקים</span>
      <span class="lab-engine" id="pgEngine">${esc(engineBadge())}</span>
      <button class="chip" id="pgEngineToggle">החלף מנוע</button>
      <button class="icon-btn" id="pgClose" aria-label="סגירה">✕</button>
    </div>
    <div class="pg-body">
      <div class="tabs" role="group" aria-label="מצב הרצה">
        <button class="tab" id="pgTabScript" data-pgmode="script" aria-pressed="true">סקריפט</button>
        <button class="tab" id="pgTabTest" data-pgmode="pytest" aria-pressed="false">pytest</button>
      </div>
      <div class="chips" id="pgChips"></div>
      <textarea class="pg-code" id="pgCode" dir="ltr" spellcheck="false" aria-label="עורך קוד"></textarea>
      <div class="lab-actions">
        <button class="run-btn" id="pgRun">▶ הרץ (Ctrl+Enter)</button>
        <button class="reveal" id="pgClear">נקה פלט</button>
      </div>
      <div id="pgOut"></div>
    </div>`;

  document.body.appendChild(scrim);
  document.body.appendChild(pg);

  pg.querySelector("#pgChips").innerHTML = PG_SNIPPETS
    .map((s, i) => `<button class="chip" data-snip="${i}">${esc(s.label)}</button>`).join("");

  const btn = document.createElement("button");
  btn.className = "icon-btn";
  btn.id = "pgOpen";
  btn.setAttribute("aria-label", "פתיחת מגרש המשחקים");
  btn.textContent = ">_";
  document.querySelector(".topbar").insertBefore(btn, document.getElementById("themeBtn"));
}

function pgMode() { return state.pgMode || "script"; }

function refreshEngineUi() {
  const badge = document.getElementById("pgEngine");
  if (badge) badge.textContent = engineBadge();
  const t = document.getElementById("pgEngineToggle");
  if (t) t.textContent = Engine.mode() === "light" ? "עבור למנוע מלא" : "עבור למנוע קל";
  document.querySelectorAll("[data-engine]").forEach(el => { el.textContent = engineBadge(); });
}

function setPgMode(mode) {
  state.pgMode = mode;
  save();
  document.getElementById("pgTabScript").setAttribute("aria-pressed", String(mode === "script"));
  document.getElementById("pgTabTest").setAttribute("aria-pressed", String(mode === "pytest"));
  document.getElementById("pgRun").textContent =
    mode === "pytest" ? "▶ הרץ pytest (Ctrl+Enter)" : "▶ הרץ (Ctrl+Enter)";
}

function openPlayground() {
  const ta = document.getElementById("pgCode");
  state.code = state.code || {};
  ta.value = state.code[PG_KEY] !== undefined ? state.code[PG_KEY] : PG_SNIPPETS[0].code;
  setPgMode(pgMode());
  document.getElementById("pg").classList.add("on");
  document.getElementById("pgScrim").classList.add("on");
  refreshEngineUi();
}

function closePlayground() {
  document.getElementById("pg").classList.remove("on");
  document.getElementById("pgScrim").classList.remove("on");
}

async function runPlayground() {
  const out = document.getElementById("pgOut");
  const code = document.getElementById("pgCode").value;
  const btn = document.getElementById("pgRun");
  const badge = document.getElementById("pgEngine");

  state.code = state.code || {};
  state.code[PG_KEY] = code;
  save();

  btn.disabled = true;
  const label = btn.textContent;
  btn.textContent = "מריץ…";
  const lines = [];
  const log = m => { lines.push(m); out.innerHTML = labOutBox("pg", lines.join("\n")); };

  const ready = await Engine.ensure(log);
  refreshEngineUi();

  try {
    if (!ready) {
      out.innerHTML = verdict("warn", "אי אפשר להריץ קוד כאן",
        Engine.reason || "מגרש המשחקים מריץ פייתון אמיתי, ולכן הוא דורש את Pyodide.",
        Engine.hints || (inSandbox ? [
          "פתח את הקובץ בדפדפן רגיל, או מהכתובת שאליה העלית אותו",
          "ההרצה הראשונה לוקחת 20–40 שניות, אחריה מיידית וגם אופליין"
        ] : null));
    } else if (pgMode() === "pytest") {
      const res = await Engine.runLab({ "test_playground.py": code });
      out.innerHTML = labOutBox("pg", res.out.trim() || "(אין פלט)");
    } else {
      const res = await Engine.runScript(code);
      out.innerHTML = labOutBox("pg", res.out.trim() || "(אין פלט)");
    }
  } catch (e) {
    out.innerHTML = labOutBox("pg", "שגיאה: " + e.message + (e.detail ? "\n\n" + e.detail : ""));
  } finally {
    btn.disabled = false;
    btn.textContent = label;
  }
}

/* ============================================================
   wiring
   ============================================================ */
buildPlayground();

document.addEventListener("click", e => {
  const run = e.target.closest("[data-run]");
  if (run) { runLab(run.dataset.run); return; }

  if (e.target.closest("#pgOpen")) { openPlayground(); return; }
  if (e.target.closest("#pgClose") || e.target.id === "pgScrim") { closePlayground(); return; }
  if (e.target.closest("#pgRun")) { runPlayground(); return; }
  if (e.target.closest("#pgEngineToggle")) {
    state.engine = Engine.mode() === "light" ? "full" : "light";
    save();
    refreshEngineUi();
    const out = document.getElementById("pgOut");
    out.innerHTML = verdict("ok", Engine.mode() === "light" ? "עברת למנוע הקל" : "עברת למנוע המלא",
      Engine.mode() === "light"
        ? "Brython — פייתון ב-JavaScript. עולה בכל מכשיר, כולל ניידים. pytest דרך המנוע המוקטן."
        : "Pyodide — CPython אמיתי עם pytest מלא וספריות C. כבד: דורש הורדה של ~25MB והרבה זיכרון.");
    return;
  }
  if (e.target.closest("#pgClear")) { document.getElementById("pgOut").innerHTML = ""; return; }

  const tab = e.target.closest("[data-pgmode]");
  if (tab) { setPgMode(tab.dataset.pgmode); return; }

  const snip = e.target.closest("[data-snip]");
  if (snip) {
    const ta = document.getElementById("pgCode");
    ta.value = PG_SNIPPETS[+snip.dataset.snip].code;
    state.code = state.code || {};
    state.code[PG_KEY] = ta.value;
    save();
    setPgMode(PG_SNIPPETS[+snip.dataset.snip].code.includes("import pytest") ? "pytest" : "script");
    return;
  }

  const reset = e.target.closest("[data-resetlab]");
  if (reset) {
    const id = reset.dataset.resetlab;
    state.code = state.code || {};
    delete state.code[id];
    save();
    document.querySelector(`[data-code="${id}"]`).value = LABS[id].starter;
    document.querySelector(`[data-result="${id}"]`).innerHTML = "";
    return;
  }

});

/* tab inserts spaces; ctrl+enter runs; autosave */
document.addEventListener("keydown", e => {
  const ta = e.target;
  if (!ta.classList || !(ta.classList.contains("lab-code") || ta.classList.contains("pg-code"))) return;

  if (e.key === "Tab") {
    e.preventDefault();
    const s = ta.selectionStart, t = ta.selectionEnd;
    ta.value = ta.value.slice(0, s) + "    " + ta.value.slice(t);
    ta.selectionStart = ta.selectionEnd = s + 4;
  }
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
    e.preventDefault();
    if (ta.dataset.code) runLab(ta.dataset.code);
    else runPlayground();
  }
  if (e.key === "Enter" && !e.ctrlKey && !e.metaKey) {
    const s = ta.selectionStart;
    const line = ta.value.slice(0, s).split("\n").pop();
    const indent = (line.match(/^\s*/) || [""])[0] + (/:\s*$/.test(line) ? "    " : "");
    if (indent) {
      e.preventDefault();
      ta.value = ta.value.slice(0, s) + "\n" + indent + ta.value.slice(ta.selectionEnd);
      ta.selectionStart = ta.selectionEnd = s + 1 + indent.length;
    }
  }
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape" && document.getElementById("pg").classList.contains("on")) closePlayground();
});

let saveTimer = null;
document.addEventListener("input", e => {
  if (e.target.id === "pgCode") {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      state.code = state.code || {};
      state.code[PG_KEY] = e.target.value;
      save();
    }, 500);
    return;
  }
  if (!e.target.dataset || !e.target.dataset.code) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    state.code = state.code || {};
    state.code[e.target.dataset.code] = e.target.value;
    save();
  }, 500);
});

/* ============================================================
   PWA — נרשם רק כשהקובץ מוגש דרך http/https (לא file://)
   ============================================================ */
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
